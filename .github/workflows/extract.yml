
name: Build RankForge

on:
  push:
    paths:
      - 'RankForge-GitHub-Build*.zip'
      - '.github/workflows/extract.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name 'RankForge-GitHub-Build*.zip' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          test -n "$ZIP_FILE"
          echo "Using $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        run: |
          find extracted -name pom.xml -print -quit | xargs -I {} sh -c 'cd "$(dirname "{}")" && mvn clean package'

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: RankForge-JAR
          path: extracted/**/target/*.jar
          

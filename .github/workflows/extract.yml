name: Build RankForge

on:
  push:
    paths:
      - 'RankForge-GitHub-Build.zip'
      - '.github/workflows/extract.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o RankForge-GitHub-Build.zip -d extracted

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        run: |
          find extracted -name pom.xml -print -quit | xargs -I {} sh -c 'cd "$(dirname "{}")" && mvn clean package'

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: RankForge-JAR
          path: extracted/**/target/*.jar
